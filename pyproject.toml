[project]
name = "rezops"
version = "0.1.1b1"
description = "Contain code to help with rez operations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2; python_version < '3.11'",
    "typer>=0.27.3",
]

[project.scripts]
rezops-build = "rezops.build:main"
rezops-get-version = "rezops.get_version:main"
rezops-get-requires = "rezops.get_requires:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "isort>=5.13",
    "mypy>=1.10",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.27",
    "pytest>=8.0",
    "ruff>=0.5",
    "pytest-sugar>=1.0",
    "pytest-cov>=6.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--cov=rezops", "--cov-report=term-missing"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
